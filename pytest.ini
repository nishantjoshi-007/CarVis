[pytest]
testpaths = tests
filterwarnings =
    error
    # joblib emits this once per array while unpickling the model. It is a
    # NumPy 2.5 deprecation inside joblib, not our code, and there is nothing
    # to fix on our side until joblib updates.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
